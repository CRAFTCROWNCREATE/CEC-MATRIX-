<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CEC MASTER CORE</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
    :root { --neon-blue: #00f3ff; --neon-purple: #bc13fe; --neon-gold: #ffd700; }
    body {
        margin: 0; background: #000; color: #fff; font-family: 'Rajdhani', sans-serif;
        height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center;
        background-image: radial-gradient(circle at 50% 50%, #1a0033 0%, #000 100%);
    }
    .glass-card {
        background: rgba(10, 15, 30, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border-radius: 20px; padding: 25px; width: 90%; max-width: 400px;
        text-align: center; margin-top: 40px;
        box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
        animation: float 6s ease-in-out infinite;
    }
    h1 { font-size: 1.5rem; letter-spacing: 2px; text-shadow: 0 0 10px var(--neon-blue); margin: 0; }
    .value { font-size: 3rem; font-weight: bold; text-shadow: 0 0 20px var(--neon-blue); margin: 10px 0; }
    .gold { color: var(--neon-gold); text-shadow: 0 0 20px var(--neon-gold); }
    .status-dot { height: 10px; width: 10px; background: #00ff00; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px #00ff00; }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
</style>
</head>
<body>
    <div class="glass-card">
        <p style="font-size: 0.8rem; letter-spacing: 2px; margin-bottom: 5px;">SYSTEM ENTANGLEMENT: <span class="status-dot"></span> ACTIVE</p>
        <h1>LIQUID ASSETS</h1>
        <div class="value">$1,250,000.00</div>
        <hr style="opacity: 0.3;">
        <h1 style="margin-top: 15px;">NET WORTH</h1>
        <div class="value gold">$176M</div>
        <p style="font-size: 0.7rem; opacity: 0.7;">LOCKED // SECURE // CEC-WAM</p>
    </div>
</body>
</html>
