<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CEC-WAM // SOVEREIGN V5</title>
<style>
    /* 1. PERFORMANCE & LOOKS */
    :root { --neon: #00f3ff; --eve: #bc13fe; --alert: #ff003c; --bg: #050505; }
    body { margin: 0; background: var(--bg); color: white; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    
    /* LIGHTWEIGHT GRID (No Lag) */
    #grid-bg {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
        background-image: linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
    }

    /* 2. DECOY SCREEN (What strangers see) */
    #decoy-layer { position: absolute; width: 100%; height: 100%; background: black; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .error-text { color: var(--alert); font-size: 1.5em; font-weight: bold; animation: blink 1s infinite; }
    #auth-input { background: transparent; border: 1px solid #333; color: #555; text-align: center; font-size: 1.2em; padding: 10px; margin-top: 20px; outline: none; width: 150px; text-transform: uppercase; }

    /* 3. REAL INTERFACE (Hidden) */
    #main-interface { display: none; width: 95%; max-width: 600px; height: 90vh; flex-direction: column; }
    
    /* HUD CARDS */
    .card { background: rgba(10,10,10,0.9); border: 1px solid var(--neon); padding: 15px; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 243, 255, 0.1); }
    .label { color: var(--eve); font-size: 0.8em; letter-spacing: 1px; font-weight: bold; }
    .val { font-size: 2em; font-weight: bold; color: white; }
    
    /* CHAT LOG (Conversational) */
    #chat-box { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid #333; overflow-y: auto; padding: 10px; font-size: 0.9em; margin-bottom: 10px; border-radius: 5px; }
    .msg-eve { color: var(--neon); margin-bottom: 5px; }
    .msg-user { color: #888; text-align: right; margin-bottom: 5px; }

    /* CONTROLS */
    .input-area { display: flex; gap: 10px; }
    #cmd-input { flex: 1; padding: 15px; background: #111; border: 1px solid var(--neon); color: white; border-radius: 5px; font-size: 1em; }
    #mic-btn { background: var(--eve); color: white; border: none; padding: 15px; border-radius: 5px; font-size: 1.2em; cursor: pointer; }
    
    @keyframes blink { 50% { opacity: 0.2; } }
</style>
</head>
<body>

    <div id="grid-bg"></div>

    <div id="decoy-layer">
        <div class="error-text">⚠️ SYSTEM FAILURE</div>
        <p style="color:#444; font-size:0.8em;">SERVER DISCONNECT ERROR 404</p>
        <input type="password" id="auth-input" placeholder="AUTH CODE" onkeyup="checkAuth(this)">
    </div>

    <div id="main-interface">
        <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <div class="label">NET WORTH</div>
                <div class="val">$176M</div>
            </div>
            <div style="text-align:right;">
                <div class="label">LIQUID</div>
                <div class="val" style="color:#00ff00;">$1.25M</div>
            </div>
        </div>

        <div id="chat-box">
            <div class="msg-eve">EVE: Systems Online. Waiting for input.</div>
        </div>

        <div class="input-area">
            <input type="text" id="cmd-input" placeholder="Type or Speak..." onkeydown="handleEnter(event)">
            <button id="mic-btn" onclick="startDictation()">🎙️</button>
        </div>
        <button onclick="sendCmd()" style="width:100%; margin-top:10px; padding:15px; background:#111; color:var(--neon); border:1px solid var(--neon); font-weight:bold;">SEND COMMAND</button>
    </div>

<script>
    // 1. DECOY LOGIC
    function checkAuth(el) {
        if(el.value === "1010") {
            document.getElementById('decoy-layer').style.display = 'none';
            document.getElementById('main-interface').style.display = 'flex';
            speak("Authorization Accepted. Welcome Sovereign.");
        }
    }

    // 2. CONVERSATIONAL BRAIN
    function sendCmd() {
        const input = document.getElementById('cmd-input');
        const txt = input.value.trim();
        if(!txt) return;

        // User Log
        logMsg("USER", txt);
        input.value = "";

        // Eve Logic
        setTimeout(() => {
            let response = "";
            const t = txt.toLowerCase();

            if(t.includes("status") || t.includes("report")) {
                response = "All systems nominal. Tracking the Orion Shadow at 22 knots.";
            } else if(t.includes("money") || t.includes("cash")) {
                response = "Liquid vault is verified at 1.25 million. Asset lock is holding.";
            } else if(t.includes("thank")) {
                response = "You are welcome, Sovereign.";
            } else {
                // Conversational Fallback
                response = "Copy that. Processing data for: " + txt; 
            }
            
            logMsg("EVE", response);
            speak(response);
        }, 500);
    }

    function logMsg(who, text) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = who === "EVE" ? "msg-eve" : "msg-user";
        div.innerText = (who === "EVE" ? ">> " : "") + text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function handleEnter(e) { if(e.key === "Enter") sendCmd(); }

    // 3. VOICE DICTATION (IPHONE FIX)
    function startDictation() {
        if ('webkitSpeechRecognition' in window) {
            const recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = "en-US";

            document.getElementById('cmd-input').placeholder = "Listening...";
            
            recognition.onresult = function(e) {
                document.getElementById('cmd-input').value = e.results[0][0].transcript;
                document.getElementById('cmd-input').placeholder = "Type or Speak...";
                // Auto-send after speaking (Optional)
                // sendCmd(); 
            };
            
            recognition.onerror = function(e) {
                alert("Mic Error. Check Permissions.");
                document.getElementById('cmd-input').placeholder = "Error. Type manually.";
            };

            recognition.start();
        } else {
            alert("Voice not supported. Use Text.");
        }
    }

    function speak(text) {
        const u = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(u);
    }
</script><script>
// ===============================
// CEC MATRIX LIVE ENGINE @EVE = HEI
// SYSTEM INPUT: 1010
// ===============================

// --- SYSTEM IDENTITY ---
const SYSTEM_ID = "@CEC_MATRIX_LIVE";
const EVE_ID = "@EVE_HEI";
const SYSTEM_INPUT = "1010";

// --- LIVE DATA ENDPOINTS (replace with your CSV URLs) ---
const CEC_CORE_CSV = "YOUR_CSV_URL_HERE";
const LOGS_CSV     = "YOUR_CSV_URL_HERE";
const PSI_CSV      = "YOUR_CSV_URL_HERE";
const WAM_CSV      = "YOUR_CSV_URL_HERE";
const MAP_CSV      = "YOUR_CSV_URL_HERE";
const CONFIG_CSV   = "YOUR_CSV_URL_HERE";

// --- CSV FETCHER ---
async function fetchCSV(url) {
  const res = await fetch(url);
  const text = await res.text();
  const rows = text.trim().split("\n").map(r => r.split(","));
  const headers = rows[0];
  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = r[i]);
    return obj;
  });
}

// --- MAIN LOADER ---
async function loadCEC() {
  console.log("CEC MATRIX LIVE ENGINE BOOTING…", SYSTEM_ID, EVE_ID, SYSTEM_INPUT);

  const [core, logs, psi, wam, map, config] = await Promise.all([
    fetchCSV(CEC_CORE_CSV),
    fetchCSV(LOGS_CSV),
    fetchCSV(PSI_CSV),
    fetchCSV(WAM_CSV),
    fetchCSV(MAP_CSV),
    fetchCSV(CONFIG_CSV)
  ]);

  // Apply CONFIG values to UI
  const titleCfg = config.find(c => c.Key === "CEC_TITLE");
  if (titleCfg) {
    const el = document.getElementById("cec-title");
    if (el) el.textContent = titleCfg.Value + " @" + EVE_ID;
  }

  // Display system input 1010
  const inputEl = document.getElementById("cec-input");
  if (inputEl) inputEl.textContent = "INPUT: " + SYSTEM_INPUT;

  // Log everything for now
  console.log({ core, logs, psi, wam, map, config });
}

loadCEC();
</script>


</body>
</html>
