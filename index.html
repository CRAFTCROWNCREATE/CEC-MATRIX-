<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CEC MASTER</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
    body { margin: 0; background: #000; overflow: hidden; height: 100vh; font-family: 'Rajdhani', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    
    /* RED DECOY LAYER */
    #decoy { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #220000 0%, #000 90%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; transition: opacity 1s; }
    .alert { border: 2px solid red; padding: 30px; background: rgba(50,0,0,0.8); box-shadow: 0 0 20px red; text-align: center; color: red; animation: pulse 2s infinite; }
    input { background: transparent; border: none; border-bottom: 2px solid red; color: red; font-size: 1.5rem; text-align: center; width: 150px; margin-top: 20px; outline: none; font-family: 'Orbitron', sans-serif; }
    
    /* BLUE HOLOGRAM LAYER */
    #holo { opacity: 0; display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 50%, #1a0033 0%, #000 100%); z-index: 5; transition: opacity 1s; }
    .card { background: rgba(10, 15, 30, 0.65); border: 1px solid rgba(0, 243, 255, 0.3); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 20px; padding: 30px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 0 30px rgba(0, 243, 255, 0.2); animation: float 6s infinite; }
    .val { font-size: 3rem; font-weight: bold; text-shadow: 0 0 20px #00f3ff; margin: 15px 0; color: #fff; }
    .gold { color: #ffd700; text-shadow: 0 0 20px #ffd700; }
    
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
    @keyframes pulse { 0% { box-shadow: 0 0 20px red; } 50% { box-shadow: 0 0 40px red; } 100% { box-shadow: 0 0 20px red; } }
</style>
</head>
<body>

    <div id="decoy">
        <div class="alert">
            <h1 style="font-family:'Orbitron'; margin:0;">ACCESS DENIED</h1>
            <p>CEC SECURITY PROTOCOL</p>
            <input type="tel" id="pass" placeholder="PIN" oninput="check(this)">
        </div>
    </div>

    <div id="holo">
        <div class="card">
            <p style="color:#00f3ff; letter-spacing:2px;">CEC SYSTEM: ONLINE</p>
            <h1>LIQUID ASSETS</h1>
            <div class="val">$1,250,000.00</div>
            <hr style="opacity:0.3; margin:20px 0;">
            <h1>NET WORTH</h1>
            <div class="val gold">$176M</div>
            <p style="color:#bc13fe; margin-top:20px;">> EVE: VOICE ACTIVE</p>
        </div>
    </div>

<script>
    function check(el) {
        if(el.value === '1010') {
            document.getElementById('pass').blur();
            let d = document.getElementById('decoy');
            let h = document.getElementById('holo');
            d.style.opacity = '0';
            setTimeout(() => { 
                d.style.display = 'none'; 
                h.style.display = 'flex'; 
                setTimeout(()=> h.style.opacity='1', 50);
                speak("Identity confirmed. Visuals online.");
            }, 1000);
        }
    }
    function speak(txt) {
        let u = new SpeechSynthesisUtterance(txt);
        window.speechSynthesis.speak(u);
    }
</script>
</body>
</html>
