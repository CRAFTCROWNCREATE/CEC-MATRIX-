<!DOCTYPE html>
<html>
<head>
    <title>CEC: 5D MATRIX</title>
    <style>
        body { background: #000; color: #00f3ff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .card { border: 1px solid #00f3ff; padding: 20px; border-radius: 10px; background: rgba(0, 243, 255, 0.1); box-shadow: 0 0 20px rgba(0,243,255,0.2); text-align: center; width: 300px; }
        h1 { font-size: 2.5rem; margin: 10px 0; text-shadow: 0 0 10px #00f3ff; }
        .label { font-size: 0.8rem; color: #fff; letter-spacing: 2px; }
        #loader { margin-top: 10px; font-size: 0.8rem; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="card">
        <div class="label">NET WORTH</div>
        <h1 id="val">$ LOADING</h1>
        <div class="label">PSI-COINS</div>
        <h2 id="coins" style="color:gold;">...</h2>
        <div id="loader">CONNECTING TO EVE...</div>
    </div>

    <script>
        // *** PASTE YOUR URL BELOW BETWEEN THE QUOTES ***
        const URL = "PASTE_YOUR_GOOGLE_URL_HERE"; 

        async function sync() {
            try {
                const req = await fetch(URL, { method: 'POST', body: JSON.stringify({action:"GET_DASHBOARD_DATA"}) });
                const res = await req.json();
                document.getElementById('val').innerText = "$" + res.netWorth.toLocaleString();
                document.getElementById('coins').innerText = res.liquidAssets + " PSI";
                document.getElementById('loader').innerText = "SYSTEM SYNCHRONIZED";
                document.getElementById('loader').style.color = "#0f0";
            } catch(e) {
                document.getElementById('loader').innerText = "LINK BROKEN - CHECK URL";
                document.getElementById('loader').style.color = "red";
            }
        }
        sync();
    </script>
</body>
</html>
