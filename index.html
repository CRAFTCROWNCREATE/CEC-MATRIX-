<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CEC-WAM // SOVEREIGN V6</title>
<style>
    :root { --neon: #00f3ff; --eve: #bc13fe; --bg: #000; }
    body { margin: 0; background: var(--bg); color: white; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    
    /* MATRIX LAYER */
    canvas { position: absolute; top: 0; left: 0; z-index: -1; opacity: 0.3; }

    /* DECOY SCREEN */
    #decoy-layer { position: absolute; width: 100%; height: 100%; background: black; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #auth-input { background: transparent; border: 1px solid #333; color: white; text-align: center; font-size: 1.5em; padding: 10px; width: 150px; }

    /* REAL INTERFACE */
    #main-interface { display: none; width: 95%; max-width: 600px; z-index: 10; flex-direction: column; }
    .card { background: rgba(0,0,0,0.8); border: 1px solid var(--neon); padding: 15px; margin-bottom: 10px; border-radius: 8px; }
    .val { font-size: 2em; font-weight: bold; }
    
    /* CHAT */
    #chat-box { height: 200px; overflow-y: auto; background: rgba(0,0,0,0.5); border: 1px solid #333; padding: 10px; margin-bottom: 10px; font-size: 0.9em; }
    .msg-eve { color: var(--neon); margin-bottom: 5px; }
    .msg-user { color: #888; text-align: right; margin-bottom: 5px; }

</style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div id="decoy-layer">
        <h1 style="color:red;">⚠️ SYSTEM LOCKED</h1>
        <input type="tel" id="auth-input" placeholder="CODE" onkeyup="checkAuth(this)">
    </div>

    <div id="main-interface">
        <div class="card">
            <div style="color:var(--eve)">NET WORTH</div>
            <div class="val">$176,000,000</div>
            <div style="color:#00ff00; margin-top:5px;">LIQUID: $1,250,000 (VERIFIED)</div>
        </div>

        <div id="chat-box">
            <div class="msg-eve">EVE: Matrix Visuals Loaded. Waiting for command...</div>
        </div>

        <button onclick="startVoice()" style="width:100%; padding:20px; background:var(--eve); color:white; border:none; font-size:1.2em; font-weight:bold;">🎙️ TAP TO SPEAK</button>
    </div>

<script>
    // 1. MATRIX RAIN (OPTIMIZED)
    const c = document.getElementById('matrix');
    const ctx = c.getContext('2d');
    c.width = window.innerWidth; c.height = window.innerHeight;
    const chars = "01CEC_WAM_V6_CORE";
    const drops = Array(Math.floor(c.width/20)).fill(1);
    
    function drawMatrix() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; 
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.fillStyle = '#0F0'; 
        ctx.font = '15px monospace';
        drops.forEach((y, i) => {
            const text = chars[Math.floor(Math.random()*chars.length)];
            ctx.fillText(text, i*20, y*20);
            if(y*20 > c.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
        requestAnimationFrame(drawMatrix);
    }
    drawMatrix();

    // 2. UNLOCK
    function checkAuth(el) {
        if(el.value === "1010") {
            document.getElementById('decoy-layer').style.display = 'none';
            document.getElementById('main-interface').style.display = 'flex';
            speak("Welcome back Sovereign.");
        }
    }

    // 3. VOICE LOGIC
    function startVoice() {
        // Simple alert for testing if voice API fails
        if (!('webkitSpeechRecognition' in window)) {
            alert("Use Chrome or Safari for Voice.");
            return;
        }
        const recognition = new webkitSpeechRecognition();
        recognition.lang = "en-US";
        recognition.start();
        
        recognition.onresult = function(event) {
            const txt = event.results[0][0].transcript;
            log("USER", txt);
            processCmd(txt);
        }
    }

    function processCmd(txt) {
        let resp = "Processing: " + txt;
        if(txt.toLowerCase().includes("status")) resp = "System Green. Matrix rain is active.";
        setTimeout(() => {
            log("EVE", resp);
            speak(resp);
        }, 500);
    }

    function log(who, msg) {
        const box = document.getElementById('chat-box');
        box.innerHTML += `<div class="${who === 'EVE' ? 'msg-eve' : 'msg-user'}">${who}: ${msg}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    function speak(t) {
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(t));
    }
</script>
</body>
</html>
