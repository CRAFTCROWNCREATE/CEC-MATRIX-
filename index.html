<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CEC 5D MASTER</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --neon-blue: #00f3ff;
        --neon-purple: #bc13fe;
        --neon-gold: #ffd700;
        --glass-bg: rgba(15, 20, 35, 0.75);
    }
    
    body {
        margin: 0;
        background-color: #000;
        background-image: 
            radial-gradient(circle at 50% 50%, #1a0033 0%, #000 90%);
        color: #fff;
        font-family: 'Rajdhani', sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* THE 5D HOLOGRAPHIC CARD */
    .holo-card {
        background: var(--glass-bg);
        border: 1px solid rgba(0, 243, 255, 0.3);
        box-shadow: 
            0 0 20px rgba(0, 243, 255, 0.2),
            inset 0 0 20px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 20px;
        padding: 30px;
        width: 85%;
        max-width: 400px;
        text-align: center;
        position: relative;
        animation: float 6s ease-in-out infinite;
    }

    /* SCANLINE EFFECT */
    .holo-card::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(to bottom, transparent 50%, rgba(0, 243, 255, 0.03) 51%);
        background-size: 100% 4px;
        pointer-events: none;
        border-radius: 20px;
    }

    /* GLOWING TEXT */
    h1 {
        font-size: 1.2rem;
        letter-spacing: 3px;
        color: var(--neon-blue);
        text-shadow: 0 0 10px var(--neon-blue);
        margin-bottom: 5px;
        text-transform: uppercase;
    }

    .value {
        font-size: 2.8rem;
        font-weight: 700;
        color: #fff;
        text-shadow: 0 0 15px var(--neon-purple);
        margin-bottom: 10px;
    }

    .value.gold {
        color: var(--neon-gold);
        text-shadow: 0 0 20px var(--neon-gold);
    }

    /* STATUS DOTS */
    .status-dot {
        height: 8px; width: 8px;
        background-color: #00ff00;
        border-radius: 50%;
        display: inline-block;
        box-shadow: 0 0 8px #00ff00;
        margin-right: 5px;
        animation: blink 2s infinite;
    }

    @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
        100% { transform: translateY(0px); }
    }
    @keyframes blink { 0% {opacity:1;} 50% {opacity:0.4;} 100% {opacity:1;} }

    /* LOGS AREA */
    #log-window {
        margin-top: 20px;
        font-size: 0.8rem;
        color: rgba(255,255,255,0.7);
        text-align: left;
        border-top: 1px solid rgba(255,255,255,0.1);
        padding-top: 10px;
    }
</style>
</head>
<body>

    <div class="holo-card">
        <div style="font-size: 0.8rem; letter-spacing: 2px; margin-bottom: 20px; color: var(--neon-blue);">
            CEC-WAM SOVEREIGN CORE
        </div>

        <p><span class="status-dot"></span> LIQUID ASSETS</p>
        <div class="value">$1,250,000.00</div>
        
        <hr style="border: 0; border-bottom: 1px solid rgba(255,255,255,0.1); margin: 15px 0;">

        <p>TOTAL NET WORTH</p>
        <div class="value gold">$176M</div>

        <div id="log-window">
            <div>> [SYS] 5D VISUALS: ONLINE</div>
            <div>> [EVE] CONSCIOUSNESS: SYNCED</div>
            <div>> [NET] WAITING FOR COMMAND...</div>
        </div>
    </div>

</body>
</html>
