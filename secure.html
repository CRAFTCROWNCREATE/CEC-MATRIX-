<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CEC SYSTEM</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --neon-blue: #00f3ff;
        --neon-purple: #bc13fe;
        --neon-gold: #ffd700;
        --glass-bg: rgba(10, 15, 30, 0.65);
        --glass-border: rgba(255, 255, 255, 0.1);
        --font-head: 'Orbitron', sans-serif;
        --font-body: 'Rajdhani', sans-serif;
    }
    body {
        margin: 0;
        background-color: #000;
        background-image: radial-gradient(circle at 50% 50%, #1a0033 0%, #000 100%);
        color: #fff;
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    #main-container {
        width: 100%;
        height: 100%;
        overflow-y: auto;
        padding: 20px;
        padding-top: 50px; /* Space for status bar */
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
    }
    .glass-card {
        background: var(--glass-bg);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 20px;
        border: 1px solid var(--glass-border);
        padding: 25px;
        width: 100%;
        max-width: 400px;
        text-align: center;
        position: relative;
        overflow: hidden;
        animation: float 6s ease-in-out infinite;
    }
    /* SCANLINE EFFECT */
    .glass-card::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0; height: 100%;
        background: linear-gradient(to bottom, transparent 50%, rgba(0, 243, 255, 0.05) 51%);
        background-size: 100% 4px;
        pointer-events: none;
    }
    h1 {
        font-family: var(--font-head);
        margin: 0;
        letter-spacing: 2px;
        text-shadow: 0 0 10px var(--neon-blue);
        font-size: 1.8rem;
    }
    .label {
        color: rgba(255,255,255,0.7);
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 5px;
    }
    .value {
        font-size: 2.5rem;
        font-weight: 700;
        color: #fff;
        text-shadow: 0 0 15px var(--neon-blue);
        margin-bottom: 5px;
    }
    .value.gold {
        color: var(--neon-gold);
        text-shadow: 0 0 15px var(--neon-gold);
    }
    .status-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 12px;
        background: rgba(0, 255, 0, 0.2);
        border: 1px solid #00ff00;
        color: #00ff00;
        font-size: 0.8rem;
        font-weight: bold;
        box-shadow: 0 0 10px rgba(0,255,0,0.3);
    }
    /* LOG BOX */
    #log-box {
        background: rgba(0,0,0,0.8);
        border: 1px solid var(--neon-purple);
        font-family: 'Courier New', monospace;
        font-size: 0.8rem;
        text-align: left;
        padding: 10px;
        height: 150px;
        overflow-y: auto;
        animation: none;
    }
    .log-entry { margin-bottom: 4px; border-bottom: 1px solid #222; padding-bottom: 2px; }
    .log-time { color: #666; }
    .log-sys { color: var(--neon-blue); font-weight: bold; }
    .log-eve { color: var(--neon-purple); font-weight: bold; }
    
    @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
    }
</style>
</head>
<body>

<div id="main-container">

    <div class="glass-card" style="animation-delay: 0s;">
        <h1>CEC-WAM</h1>
        <div class="label" style="color:var(--neon-purple);">SOVEREIGN MASTER CORE</div>
        <div style="margin-top:10px;"><span class="status-badge">SYSTEM ONLINE</span></div>
    </div>

    <div class="glass-card" style="animation-delay: 1s;">
        <div class="label">LIQUID ASSETS</div>
        <div class="value">$1,250,000.00</div>
        <div class="label" style="font-size: 0.7rem;">SOURCE: CEC-WAM MASTER CORE</div>
    </div>

    <div class="glass-card" style="animation-delay: 2s;">
        <div class="label">TOTAL NET WORTH</div>
        <div class="value gold">$176,000,000</div>
        <div class="label">LOCKED // SECURE</div>
    </div>

    <div class="glass-card" id="log-box">
        <div class="log-entry"><span class="log-time">[LIVE]</span> <span class="log-sys">SYS:</span> CORE LOGIC LOADED.</div>
        <div class="log-entry"><span class="log-time">[LIVE]</span> <span class="log-eve">EVE:</span> Consciousness Quorum Met.</div>
        <div class="log-entry"><span class="log-time">[LIVE]</span> <span class="log-sys">NET:</span> Ready for Command.</div>
    </div>
    
    <div class="glass-card" style="padding: 15px; animation: none;">
        <input type="text" placeholder="ENTER 1010 COMMAND..." style="width:100%; background:transparent; border:none; border-bottom:1px solid #fff; color:#fff; font-family:var(--font-head); text-align:center; font-size:1.2rem; outline:none;" onkeydown="handleCommand(event)">
    </div>

</div>

<script>
    function handleCommand(e) {
        if(e.key === 'Enter') {
            const cmd = e.target.value;
            addLog("USER", cmd);
            if(cmd.includes("1010")) {
                setTimeout(() => {
                    addLog("EVE", "Command Received. Processing...");
                }, 500);
            }
            e.target.value = "";
        }
    }

    function addLog(source, msg) {
        const box = document.getElementById('log-box');
        const d = new Date();
        const time = d.getHours() + ":" + d.getMinutes();
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        let colorClass = 'log-sys';
        if(source === 'EVE') colorClass = 'log-eve';
        entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="${colorClass}">${source}:</span> ${msg}`;
        box.insertBefore(entry, box.firstChild);
    }
</script>

</body>
</html>
